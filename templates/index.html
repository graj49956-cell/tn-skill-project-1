<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} — AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
  <header class="hero">
    <div class="brand-mark">E</div>
    <div><h1>Welcome to EduGenie 🧠✨</h1><p>Your personal AI tutor for learning support.</p></div>
  </header>

  <section class="grid">
    <article class="card">
      <h2>Ask EduGenie a Question</h2>
      <form id="qaForm">
        <input id="question" type="text" placeholder="Why is the sky blue?" required>
        <button type="submit">Get Answer</button>
      </form>
      <div id="qaResult" class="output"></div>
    </article>

    <article class="card">
      <h2>Need an Explanation?</h2>
      <form id="explainForm">
        <input id="topic" type="text" placeholder="Photosynthesis" required>
        <button type="submit">Explain</button>
      </form>
      <div id="explanationResult" class="output"></div>
    </article>

    <article class="card wide">
      <h2>Summarize a Paragraph</h2>
      <form id="summaryForm">
        <textarea id="summaryText" placeholder="Paste long content to summarize" required></textarea>
        <button type="submit">Summarize</button>
      </form>
      <div id="summaryResult" class="output"></div>
    </article>

    <article class="card wide">
      <h2>Generate a Quiz</h2>
      <form id="quizForm">
        <textarea id="quizText" placeholder="Paste a topic or study passage..." required></textarea>
        <button type="submit">Generate Quiz</button>
      </form>
      <div id="quizResult" class="output"></div>
    </article>

    <article class="card wide">
      <h2>Get Learning Recommendations</h2>
      <form id="recommendForm">
        <input id="recommendTopic" type="text" placeholder="e.g. Linear Regression" required>
        <button type="submit">Get Recommendations</button>
      </form>
      <div id="recommendResult" class="output"></div>
    </article>
  </section>

  <footer><span>EduGenie</span><span>FastAPI + Google Gemini</span></footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
